[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "exam-agent-backend"
version = "0.1.0"
description = "试卷考点拆解与分块练习 Agent 后端"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "openai>=1.55.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-openai>=0.2.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "trafilatura>=1.12.0",
    "fpdf2>=2.8.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]
# 练习 PDF：KaTeX 栅格（Playwright + CDN，导出时需外网拉取 KaTeX 静态资源）
latex = ["playwright>=1.49.0"]
# composite 子图 SVG 栅格化：仅 pip 装 cairosvg 不够，还需系统 libcairo（Windows 常需 GTK/cairo DLL 在 PATH）。
# 详见仓库根目录 DEV_RUNBOOK.md「分块练习配图：cairosvg 与系统 cairo」；无 cairo 时 SVG 子图为占位，相关 pytest skip。
svg = ["cairosvg>=2.7.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "katex: 需 Playwright+Chromium 与网络（CDN KaTeX），默认 CI 跳过",
]
